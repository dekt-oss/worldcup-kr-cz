<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한민국 월드컵 스코어 내기 · 종료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#07120E; --bg1:#0E1F19;
    --gold:#F2C14E; --gold-soft:rgba(242,193,78,.14);
    --cream:#F4F1E8; --muted:rgba(244,241,232,.52);
    --line:rgba(244,241,232,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg0)}
  body{
    font-family:'Pretendard',system-ui,sans-serif;color:var(--cream);
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(242,193,78,.10), transparent 55%),
      linear-gradient(180deg,var(--bg1),var(--bg0));
    background-attachment:fixed;min-height:100vh;line-height:1.6;
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
  }
  .card{
    max-width:440px;width:100%;text-align:center;
    border:1px solid var(--line);border-radius:24px;padding:44px 28px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    box-shadow:0 24px 60px -28px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px}
  .lock{font-size:52px;line-height:1;margin-bottom:18px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
  h1{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:.01em;margin-bottom:14px}
  p{font-size:14px;color:var(--muted);margin-bottom:10px}
  p b{color:var(--cream)}
  .divider{height:1px;background:var(--line);border:0;margin:24px 0}
  .foot{font-size:12px;color:var(--muted);margin-top:4px}
  .badge{display:inline-block;margin-top:22px;font-size:12px;font-weight:800;padding:8px 14px;border-radius:999px;
    background:var(--gold-soft);color:var(--gold);border:1px solid rgba(242,193,78,.35)}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">WORLD CUP · KR</div>
    <div class="lock">🔒</div>
    <h1>내기 서비스 종료</h1>
    <p>대한민국 월드컵 조별리그 <b>스코어 맞히기 내기</b>가 종료되었습니다.</p>
    <p>그동안 참여해 주셔서 감사합니다.</p>
    <hr class="divider">
    <p class="foot">정산·문의는 모임 단톡방에서 진행해 주세요.</p>
    <div class="badge">SERVICE CLOSED</div>
  </div>
</body>
</html>
