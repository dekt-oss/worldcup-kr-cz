<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한민국 월드컵 조별리그 · 스코어 맞히기 내기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#07120E; --bg1:#0E1F19;
    --kr:#E23744; --kr-soft:rgba(226,55,68,.16);
    --cz:#3B82C4; --cz-soft:rgba(59,130,196,.16);
    --gold:#F2C14E; --gold-soft:rgba(242,193,78,.14);
    --cream:#F4F1E8; --muted:rgba(244,241,232,.52);
    --line:rgba(244,241,232,.12);
    --tile:#0A1813;
    --green:#56d27a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Pretendard',system-ui,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(242,193,78,.10), transparent 55%),
      radial-gradient(90% 60% at 50% 0%, rgba(59,130,196,.08), transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg0));
    background-attachment:fixed;
    min-height:100vh;
    line-height:1.5;
    padding:28px 18px 56px;
  }
  .wrap{max-width:640px;margin:0 auto}

  /* header */
  .eyebrow{
    font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);font-weight:700;text-align:center;margin-bottom:14px;
  }
  .eyebrow span{opacity:.5;color:var(--cream)}

  /* identity bar */
  .me{
    display:flex;align-items:center;gap:8px;margin-bottom:16px;
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;
    background:rgba(255,255,255,.025);
  }
  .me label{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
  .me input{
    flex:1;background:var(--tile);border:1px solid var(--line);border-radius:10px;
    color:var(--cream);font-family:inherit;font-size:14px;font-weight:700;
    padding:9px 11px;outline:none;
  }
  .me input:focus{border-color:var(--gold)}
  .me .who{font-size:12px;color:var(--muted);font-weight:600}
  .me .who b{color:var(--gold)}

  /* sync badge */
  .sync{display:flex;justify-content:center;margin-bottom:14px}
  .sync .pill{
    display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
    letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.02);
  }
  .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .sync.on .dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
  .sync.on .pill{color:var(--cream)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* tabs */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .tab{
    border:1px solid var(--line);border-radius:14px;padding:11px 8px;cursor:pointer;
    background:rgba(255,255,255,.02);text-align:center;transition:border-color .2s, background .2s, transform .1s;
  }
  .tab:active{transform:translateY(1px)}
  .tab .t-no{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
  .tab .t-vs{font-size:14px;font-weight:900;margin-top:3px;letter-spacing:-.01em}
  .tab .t-when{font-size:10px;color:var(--muted);margin-top:3px}
  .tab .t-state{font-size:10px;font-weight:800;margin-top:4px;letter-spacing:.03em}
  .tab.active{border-color:var(--gold);background:var(--gold-soft)}
  .tab.active .t-no{color:var(--gold)}
  .tab .t-state.live{color:#FF8b94}
  .tab .t-state.done{color:var(--gold)}
  .tab .t-state.soon{color:var(--muted)}

  .panel{display:none}
  .panel.active{display:block;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* scoreboard */
  .board{
    position:relative;border:1px solid var(--line);border-radius:22px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    padding:24px 18px 20px;
    box-shadow:0 24px 60px -28px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .meta{text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:16px;letter-spacing:.02em}
  .meta b{color:var(--cream)}
  .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .team{text-align:center}
  .team .flag{font-size:34px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  .team .name{font-weight:900;font-size:18px;margin-top:8px;letter-spacing:-.01em}
  .team .badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;background:rgba(255,255,255,.05);color:var(--muted)}
  .team.kr .badge{background:var(--kr-soft);color:#FF8b94}

  .tiles{display:flex;align-items:center;gap:8px;justify-content:center}
  .tile{
    width:62px;height:84px;border-radius:14px;background:var(--tile);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;font-size:52px;line-height:1;color:var(--cream);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.04);text-align:center;
  }
  .colon{font-family:'Anton',sans-serif;font-size:40px;color:var(--muted);padding-bottom:6px}
  .outcome{text-align:center;margin-top:14px;min-height:20px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
  .outcome.final{color:var(--gold)}
  .scorers{text-align:center;font-size:12px;color:var(--cream);margin-top:7px;font-weight:600;letter-spacing:.02em}
  .scorers span{color:var(--muted);font-weight:500}

  /* my-bet box */
  .mybet{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
  .mybet .h{font-size:13px;font-weight:800;text-align:center;margin-bottom:12px;letter-spacing:.02em}
  .mybet .h span{color:var(--muted);font-weight:600}
  .bet-tiles{display:flex;align-items:center;gap:8px;justify-content:center}
  input.bt{
    width:56px;height:72px;border-radius:12px;background:var(--tile);border:1px solid var(--line);
    text-align:center;font-family:'Anton',sans-serif;font-size:42px;color:var(--cream);outline:none;padding:0;
    -moz-appearance:textfield;appearance:textfield;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.55);
  }
  input.bt::-webkit-outer-spin-button,input.bt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.bt:focus{border-color:var(--gold);box-shadow:inset 0 2px 8px rgba(0,0,0,.55), 0 0 0 3px var(--gold-soft)}
  input.bt.kr{color:#FF6B74}
  .bet-col{font-family:'Anton',sans-serif;font-size:30px;color:var(--muted);padding-bottom:4px}
  .save{
    width:100%;margin-top:14px;border:none;border-radius:13px;padding:14px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:15px;background:var(--gold);color:#1a1305;transition:filter .2s, transform .1s;
  }
  .save:hover{filter:brightness(1.06)} .save:active{transform:translateY(1px)}
  .save:disabled{background:rgba(255,255,255,.08);color:var(--muted);cursor:not-allowed}
  .lockmsg{text-align:center;margin-top:12px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.03em}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;min-height:14px}
  .hint.err{color:#FF8b94}

  /* prize */
  .prize{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px dashed var(--line);padding-top:14px}
  .prize .amt{font-family:'Anton',sans-serif;font-size:26px;color:var(--gold)}
  .prize .lbl{font-size:12px;color:var(--muted);font-weight:600}

  /* predictions */
  .sec{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .sec-head h2{font-size:15px;font-weight:800}
  .sec-head .count{font-size:12px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pred{border:1px solid var(--line);border-radius:16px;padding:13px;background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0))}
  .pred .p-name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
  .pred .p-name .me-tag{font-size:10px;background:var(--gold-soft);color:var(--gold);padding:1px 6px;border-radius:999px;font-weight:800}
  .pred .p-score{font-family:'Anton',sans-serif;font-size:30px;margin-top:6px;letter-spacing:.04em}
  .pred .p-score .s-kr{color:#FF6B74}.pred .p-score .s-cz{color:#7CB6E8}.pred .p-score .s-col{color:var(--muted);margin:0 4px}
  .pred .p-result{font-size:11px;font-weight:800;margin-top:6px;min-height:14px;letter-spacing:.03em;color:var(--muted)}
  .pred.win{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 30px -12px var(--gold-soft)}
  .pred.win .p-result{color:var(--gold)}
  .pred.miss{opacity:.55}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:14px}

  /* banner */
  .banner{margin-top:16px;border-radius:16px;padding:16px;text-align:center;border:1px solid var(--line);display:none}
  .banner.show{display:block;animation:rise .45s ease both}
  .banner.win{background:var(--gold-soft);border-color:rgba(242,193,78,.45)}
  .banner.roll{background:rgba(255,255,255,.03)}
  .banner .b-top{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .banner.win .b-top{color:var(--gold)}
  .banner .b-main{font-weight:900;font-size:20px;margin-top:6px}
  .banner .b-sub{font-size:12px;color:var(--muted);margin-top:6px}

  /* admin result override */
  .admin{margin-top:14px;text-align:center}
  .admin .toggle{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit}
  .admin .box{display:none;margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.02)}
  .admin .box.show{display:block}
  .admin .box .t{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:700}
  .admin input{width:48px;height:54px;border-radius:10px;background:var(--tile);border:1px solid var(--line);text-align:center;font-family:'Anton',sans-serif;font-size:32px;color:var(--cream);outline:none}
  .admin input:focus{border-color:var(--gold)}
  .admin .row{display:flex;align-items:center;justify-content:center;gap:8px}
  .admin .btns{display:flex;gap:8px;margin-top:12px}
  .admin .btns button{flex:1;border:none;border-radius:11px;padding:11px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
  .admin .set{background:var(--gold);color:#1a1305}
  .admin .clr{background:transparent;color:var(--muted);border:1px solid var(--line)}

  /* rules */
  .rules{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(255,255,255,.02)}
  .rules li{list-style:none;display:flex;gap:11px;padding:8px 0;font-size:14px;color:var(--cream)}
  .rules li+li{border-top:1px solid var(--line)}
  .rules .k{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--gold-soft);color:var(--gold);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .rules .v b{color:var(--gold);font-weight:800}

  footer{text-align:center;margin-top:30px;font-size:12px;color:var(--muted);line-height:1.7}
  footer .live{display:inline-flex;align-items:center;gap:6px}
  footer .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}

  @media (max-width:380px){
    .tile{width:54px;height:74px;font-size:44px}
    .grid{grid-template-columns:1fr}
    .tab .t-vs{font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">대한민국 <span>·</span> 월드컵 조별리그 스코어 내기</div>

  <!-- identity -->
  <div class="me">
    <label>내 이름</label>
    <input id="meName" type="text" maxlength="12" placeholder="이름을 입력하면 베팅 저장" autocomplete="off">
    <span class="who" id="meWho"></span>
  </div>

  <div class="sync" id="sync"><span class="pill"><span class="dot"></span><span id="syncTxt">로컬 저장 모드</span></span></div>

  <!-- tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- panels -->
  <div id="panels"></div>

  <!-- rules -->
  <div class="sec">
    <div class="sec-head"><h2>규칙</h2></div>
    <ul class="rules">
      <li><span class="k">₩</span><span class="v">경기별로 <b>정확한 스코어</b>를 맞힌 사람이 상금 풀을 가져갑니다.</span></li>
      <li><span class="k">①</span><span class="v">베팅은 <b>킥오프 전까지만</b> 입력·수정 가능 (이후 자동 잠금).</span></li>
      <li><span class="k">②</span><span class="v">아무도 못 맞히면 상금은 <b>다음 경기로 이월</b>.</span></li>
      <li><span class="k">③</span><span class="v">두 명 이상 적중 시 상금 <b>균등 분배</b>.</span></li>
    </ul>
  </div>

  <footer>
    <div class="live"><span class="dot"></span> <span id="footMode">결과는 링크를 연 모두에게 공유됩니다</span></div>
    <div style="margin-top:6px">대한민국 · 2026 FIFA 월드컵 A조</div>
  </footer>

</div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ============================================================
   1) 설정 — Firebase (공유 저장).  값이 비어 있으면 자동으로
   기기별(localStorage) 저장으로 동작합니다. Firebase 콘솔 >
   프로젝트 설정 > 일반 > 내 앱(웹)의 firebaseConfig를 붙여넣고,
   Realtime Database를 만든 뒤 databaseURL을 채우세요.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB2Q-O777jpT-hpeXq1OJRN5YcTEaiRnxU",
  authDomain: "score-327fa.firebaseapp.com",
  databaseURL: "https://score-327fa-default-rtdb.firebaseio.com",
  projectId: "score-327fa",
  storageBucket: "score-327fa.firebasestorage.app",
  messagingSenderId: "193082438847",
  appId: "1:193082438847:web:70e6779ac67d501fa9820a"
};

/* ============================================================
   2) 경기 일정 (한국시간 기준).  koUTC = 킥오프(UTC) → 잠금 기준.
   seed = 이미 알려진 결과(자동 fetch/수동 입력으로 덮어쓰기 가능).
   home/away 순서는 실제 경기 기준. krHome=true면 한국이 홈.
   ============================================================ */
const MATCHES = [
  { id:'kr-cz', no:'1차전', krHome:true,
    home:{flag:'🇰🇷',name:'대한민국',kr:true}, away:{flag:'🇨🇿',name:'체코',kr:false},
    koUTC:'2026-06-12T02:00:00Z', when:'6/12(금) 11:00', venue:'과달라하라 · Estadio Akron',
    prize:50000, seed:{h:2,a:1,final:true,scorers:{home:['황인범','오현규'],away:[]}} },
  { id:'mx-kr', no:'2차전', krHome:false,
    home:{flag:'🇲🇽',name:'멕시코',kr:false}, away:{flag:'🇰🇷',name:'대한민국',kr:true},
    koUTC:'2026-06-19T01:00:00Z', when:'6/19(금) 10:00', venue:'과달라하라 · Estadio Akron',
    prize:50000, seed:null },
  { id:'za-kr', no:'3차전', krHome:false,
    home:{flag:'🇿🇦',name:'남아공',kr:false}, away:{flag:'🇰🇷',name:'대한민국',kr:true},
    koUTC:'2026-06-25T01:00:00Z', when:'6/25(목) 10:00', venue:'몬테레이 · Estadio BBVA',
    prize:50000, seed:null },
];

/* worldcup26.ir 자동 결과 fetch 대상 (무인증).  스키마가 달라도
   화면은 seed/수동입력으로 동작하므로 실패해도 안전.  */
const RESULT_API = 'https://worldcup26.ir/get/games';

/* ============================================================
   상태 + 저장 백엔드 (Firebase 또는 localStorage)
   ============================================================ */
const LS = { bets:'wc26-bets', results:'wc26-results', name:'wc26-name' };
let FB=null, db=null;
let STATE = { bets:{}, results:{} };   // bets[matchId][userKey]={name,h,a,ts}; results[matchId]={h,a,final,ts}
let myName = localStorage.getItem(LS.name) || '';
let active = 0;

const keyOf = s => (s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[.#$\[\]/]/g,'');
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fbEnabled(){ return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL); }

function initBackend(){
  if(fbEnabled() && window.firebase){
    try{
      FB = firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      db.ref('bets').on('value', s=>{ STATE.bets = s.val()||{}; renderAll(); });
      db.ref('results').on('value', s=>{ STATE.results = s.val()||{}; renderAll(); });
      setSync(true,'실시간 공유 중');
      document.getElementById('footMode').textContent='결과·예측이 모두에게 실시간 공유됩니다';
      return;
    }catch(e){ console.warn('Firebase init 실패, 로컬 모드로 전환', e); }
  }
  // local fallback
  try{ STATE.bets = JSON.parse(localStorage.getItem(LS.bets)||'{}'); }catch(e){ STATE.bets={}; }
  try{ STATE.results = JSON.parse(localStorage.getItem(LS.results)||'{}'); }catch(e){ STATE.results={}; }
  setSync(false,'이 기기에만 저장 (공유 안 됨)');
  document.getElementById('footMode').textContent='이 기기에 저장 — 공유하려면 Firebase 설정 필요';
}
function setSync(on,txt){
  const el=document.getElementById('sync'); el.classList.toggle('on',on);
  document.getElementById('syncTxt').textContent=txt;
}

function saveBet(matchId, h, a){
  const uk = keyOf(myName);
  const rec = { name:myName.trim(), h, a, ts:Date.now() };
  if(db){ db.ref('bets/'+matchId+'/'+uk).set(rec); }
  else{
    STATE.bets[matchId]=STATE.bets[matchId]||{}; STATE.bets[matchId][uk]=rec;
    localStorage.setItem(LS.bets, JSON.stringify(STATE.bets)); renderAll();
  }
}
function setResult(matchId, h, a, final){
  const rec = { h, a, final:!!final, ts:Date.now() };
  if(db){ db.ref('results/'+matchId).set(rec); }
  else{ STATE.results[matchId]=rec; localStorage.setItem(LS.results, JSON.stringify(STATE.results)); renderAll(); }
}
function clearResult(matchId){
  if(db){ db.ref('results/'+matchId).remove(); }
  else{ delete STATE.results[matchId]; localStorage.setItem(LS.results, JSON.stringify(STATE.results)); renderAll(); }
}

/* 결과 우선순위: 수동/공유 override > seed.  (API는 fetch 후 results로 주입) */
function resultOf(m){
  const seedScorers = (m.seed && m.seed.scorers) || null;
  const r = STATE.results[m.id];
  if(r && r.h!=null && r.a!=null) return { h:+r.h, a:+r.a, final:!!r.final, scorers:seedScorers };
  if(m.seed) return { h:m.seed.h, a:m.seed.a, final:!!m.seed.final, scorers:seedScorers };
  return null;
}
/* 적중자 목록 (결과 확정 전이면 null) */
function winnersOf(m){
  const res=resultOf(m); if(!(res&&res.final)) return null;
  const bets=STATE.bets[m.id]||{};
  return Object.values(bets).filter(b=>+b.h===res.h && +b.a===res.a);
}
/* 실제 상금 풀 = 이 경기 상금 + 앞 경기들에서 적중자 없이 끝난 상금 이월 누적.
   중간에 적중자가 나오면 그 사람이 가져가므로 이월은 0으로 리셋. */
function potOf(m){
  const idx=MATCHES.indexOf(m); let carry=0;
  for(let i=0;i<idx;i++){
    const w=winnersOf(MATCHES[i]);
    if(w===null) continue;        // 아직 결과 미확정 → 이월 미정
    if(w.length===0) carry+=MATCHES[i].prize;  // 미적중 → 이월
    else carry=0;                 // 적중자가 가져감 → 이월 소멸
  }
  return m.prize+carry;
}
function isLocked(m){ return Date.now() >= new Date(m.koUTC).getTime(); }
function dday(m){
  const diff = new Date(m.koUTC).getTime() - Date.now();
  if(diff<=0) return null;
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000);
  return d>0 ? `D-${d}` : `${h}시간 후`;
}
const won = (h,a,m)=>{ // 결과 텍스트 (한국 관점 표기)
  if(h>a) return m.home.name+' 승';
  if(h<a) return m.away.name+' 승';
  return '무승부';
};
const fmt = n => Number(n).toLocaleString('ko-KR');

/* ============================================================
   렌더링
   ============================================================ */
function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  MATCHES.forEach((m,i)=>{
    const res=resultOf(m), locked=isLocked(m);
    let state='soon', stxt = dday(m) ? '예정 · '+dday(m) : '진행/종료';
    if(res && res.final){ state='done'; stxt='종료 '+res.h+':'+res.a; }
    else if(locked){ state='live'; stxt='경기중'; }
    const el=document.createElement('div');
    el.className='tab'+(i===active?' active':''); el.dataset.i=i;
    el.innerHTML = `<div class="t-no">${m.no}</div>
      <div class="t-vs">${m.home.flag} ${shortVs(m)} ${m.away.flag}</div>
      <div class="t-when">${m.when}</div>
      <div class="t-state ${state}">${stxt}</div>`;
    el.onclick=()=>{ active=i; renderAll(); };
    t.appendChild(el);
  });
}
function shortVs(m){
  const sh = n => ({'대한민국':'한','체코':'체','멕시코':'멕','남아공':'남'}[n]||n.slice(0,1));
  return sh(m.home.name)+':'+sh(m.away.name);
}

function buildPanels(){
  const wrap=document.getElementById('panels'); wrap.innerHTML='';
  MATCHES.forEach((m,i)=>{
    const p=document.createElement('div'); p.className='panel'+(i===active?' active':''); p.id='panel-'+i;
    p.appendChild(renderBoard(m));
    p.appendChild(renderPredictions(m));
    wrap.appendChild(p);
  });
}

function renderBoard(m){
  const res=resultOf(m), locked=isLocked(m);
  const uk=keyOf(myName);
  const myBet = (STATE.bets[m.id]||{})[uk];
  const wrap=document.createElement('div'); wrap.className='board';

  const hS = res ? res.h : '–', aS = res ? res.a : '–';
  wrap.innerHTML = `
    <div class="meta"><b>${m.no}</b> · ${m.when} KST · ${esc(m.venue)}</div>
    <div class="matchup">
      <div class="team ${m.home.kr?'kr':''}">
        <div class="flag">${m.home.flag}</div><div class="name">${esc(m.home.name)}</div>
        <div class="badge">${m.home.kr?'KOREA':'HOME'}</div>
      </div>
      <div class="tiles"><div class="tile">${hS}</div><div class="colon">:</div><div class="tile">${aS}</div></div>
      <div class="team ${m.away.kr?'kr':''}">
        <div class="flag">${m.away.flag}</div><div class="name">${esc(m.away.name)}</div>
        <div class="badge">${m.away.kr?'KOREA':'AWAY'}</div>
      </div>
    </div>
    <div class="outcome ${res&&res.final?'final':''}">${
      res ? (res.final?'최종 결과 · ':'진행중 · ')+won(res.h,res.a,m) : '경기 예정 · '+(dday(m)||'곧 시작')
    }</div>
    ${res&&res.scorers&&res.scorers.home&&res.scorers.home.length
      ? `<div class="scorers">⚽ ${res.scorers.home.map(esc).join(' · ')} <span>(${esc(m.home.kr?m.home.name:m.away.name)})</span></div>` : ''}`;

  // my bet area
  const bet=document.createElement('div'); bet.className='mybet';
  if(locked){
    let mine = myBet ? `<div class="hint">내 베팅: <b style="color:var(--cream)">${myBet.h} : ${myBet.a}</b></div>` :
      `<div class="hint">이 경기에 베팅하지 않았습니다</div>`;
    bet.innerHTML = `<div class="lockmsg">🔒 입력 마감 (킥오프)</div>${mine}`;
  }else{
    bet.innerHTML = `
      <div class="h">내 예측 스코어 <span>· ${esc(m.home.name)} : ${esc(m.away.name)}</span></div>
      <div class="bet-tiles">
        <input class="bt ${m.home.kr?'kr':''}" id="bh-${m.id}" type="number" min="0" max="99" inputmode="numeric" placeholder="–" value="${myBet?myBet.h:''}">
        <div class="bet-col">:</div>
        <input class="bt ${m.away.kr?'kr':''}" id="ba-${m.id}" type="number" min="0" max="99" inputmode="numeric" placeholder="–" value="${myBet?myBet.a:''}">
      </div>
      <button class="save" id="save-${m.id}">${myBet?'베팅 수정 저장':'베팅 저장'}</button>
      <div class="hint" id="hint-${m.id}">${myName?'':'먼저 위에 이름을 입력하세요'}</div>`;
  }
  wrap.appendChild(bet);

  // prize + banner
  const pot=potOf(m); const carry=pot-m.prize;
  const prize=document.createElement('div'); prize.className='prize';
  prize.innerHTML=`<div class="amt">${fmt(pot)}원</div><div class="lbl">${carry>0?`기본 ${fmt(m.prize)} + 이월 ${fmt(carry)}원`:'정확히 맞히면 독식'}</div>`;
  wrap.appendChild(prize);

  if(res && res.final) wrap.appendChild(renderBanner(m,res));

  // admin override
  const admin=document.createElement('div'); admin.className='admin';
  admin.innerHTML=`
    <button class="toggle" id="adm-${m.id}">결과 직접 입력 / 수정</button>
    <div class="box" id="admbox-${m.id}">
      <div class="t">최종 스코어 입력 (자동 결과가 틀리거나 비어 있을 때)</div>
      <div class="row">
        <input id="ah-${m.id}" type="number" min="0" max="99" value="${res?res.h:''}" placeholder="${esc(m.home.name)}">
        <span class="bet-col" style="font-size:24px">:</span>
        <input id="aa-${m.id}" type="number" min="0" max="99" value="${res?res.a:''}" placeholder="${esc(m.away.name)}">
      </div>
      <div class="btns">
        <button class="set" id="aset-${m.id}">최종 확정</button>
        <button class="clr" id="aclr-${m.id}">자동값으로 되돌리기</button>
      </div>
    </div>`;
  wrap.appendChild(admin);
  return wrap;
}

function renderBanner(m,res){
  const pot=potOf(m);
  const bets=STATE.bets[m.id]||{};
  const total=Object.keys(bets).length;
  const winners=Object.values(bets).filter(b=>+b.h===res.h && +b.a===res.a);
  const idx=MATCHES.indexOf(m); const next=MATCHES[idx+1];
  const b=document.createElement('div'); b.className='banner show '+(winners.length?'win':'roll');
  if(winners.length){
    const names=winners.map(w=>esc(w.name)).join(' · ');
    const per=Math.floor(pot/winners.length);
    b.innerHTML = winners.length===1
      ? `<div class="b-top">WINNER</div><div class="b-main">🏆 ${names} 적중!</div><div class="b-sub">정답 ${res.h}:${res.a} · 상금 ${fmt(pot)}원 단독 획득</div>`
      : `<div class="b-top">WINNER</div><div class="b-main">🏆 공동 우승 · ${names}</div><div class="b-sub">정답 ${res.h}:${res.a} · ${fmt(pot)}원을 ${winners.length}명이 분배 (1인 ${fmt(per)}원)</div>`;
  }else{
    b.innerHTML = `<div class="b-top">이월 · CARRY OVER</div><div class="b-main">🙅 적중자 없음${total?` · ${total}명 전원 미적중`:''}</div><div class="b-sub">정답 ${res.h}:${res.a} — 아무도 못 맞혀 상금 ${fmt(pot)}원이 ${next?esc(next.no)+'으로':'다음 경기로'} 이월됩니다</div>`;
  }
  return b;
}

function renderPredictions(m){
  const res=resultOf(m);
  const bets=STATE.bets[m.id]||{};
  const entries=Object.entries(bets).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  const sec=document.createElement('div'); sec.className='sec';
  const uk=keyOf(myName);
  let cards;
  if(entries.length===0){
    cards=`<div class="empty">아직 베팅한 사람이 없습니다${isLocked(m)?'':' · 첫 베팅을 남겨보세요'}</div>`;
  }else{
    cards=entries.map(([k,p])=>{
      let cls='', rtxt='';
      if(res && res.final){
        if(+p.h===res.h && +p.a===res.a){ cls='win'; rtxt='🎯 적중'; }
        else{ cls='miss'; rtxt='오차 '+(Math.abs(p.h-res.h)+Math.abs(p.a-res.a))+'골'; }
      }else{ rtxt = isLocked(m)?'결과 대기':'예측 완료'; }
      const meTag = k===uk ? '<span class="me-tag">나</span>':'';
      return `<div class="pred ${cls}">
        <div class="p-name">${esc(p.name||k)} ${meTag}</div>
        <div class="p-score"><span class="${m.home.kr?'s-kr':'s-cz'}">${p.h}</span><span class="s-col">:</span><span class="${m.away.kr?'s-kr':'s-cz'}">${p.a}</span></div>
        <div class="p-result">${rtxt}</div>
      </div>`;
    }).join('');
  }
  let summary='';
  if(res && res.final){
    const wc=entries.filter(([k,p])=>+p.h===res.h && +p.a===res.a).length;
    summary = wc>0 ? ` · 🎯 적중 ${wc}명` : (entries.length?' · 적중자 없음':'');
  }
  sec.innerHTML = `<div class="sec-head"><h2>예측 현황</h2><div class="count">${entries.length}명 참여${isLocked(m)?' · 마감':''}${summary}</div></div><div class="grid">${cards}</div>`;
  return sec;
}

function wireBoard(m){
  const sv=document.getElementById('save-'+m.id);
  if(sv){
    sv.onclick=()=>{
      const hint=document.getElementById('hint-'+m.id);
      if(!myName.trim()){ hint.className='hint err'; hint.textContent='먼저 위에 이름을 입력하세요'; return; }
      if(isLocked(m)){ hint.className='hint err'; hint.textContent='입력이 마감되었습니다'; renderAll(); return; }
      const h=parseInt(document.getElementById('bh-'+m.id).value,10), a=parseInt(document.getElementById('ba-'+m.id).value,10);
      if(isNaN(h)||isNaN(a)||h<0||a<0){ hint.className='hint err'; hint.textContent='두 팀 점수를 모두 입력하세요'; return; }
      saveBet(m.id,h,a);
      hint.className='hint'; hint.textContent='저장되었습니다 ✓';
    };
  }
  const tg=document.getElementById('adm-'+m.id);
  if(tg) tg.onclick=()=>document.getElementById('admbox-'+m.id).classList.toggle('show');
  const aset=document.getElementById('aset-'+m.id);
  if(aset) aset.onclick=()=>{
    const h=parseInt(document.getElementById('ah-'+m.id).value,10), a=parseInt(document.getElementById('aa-'+m.id).value,10);
    if(isNaN(h)||isNaN(a)||h<0||a<0) return;
    setResult(m.id,h,a,true);
  };
  const aclr=document.getElementById('aclr-'+m.id);
  if(aclr) aclr.onclick=()=>clearResult(m.id);
}

function renderAll(){
  buildTabs(); buildPanels();
  MATCHES.forEach(wireBoard);
}

/* ============================================================
   결과 자동 fetch (worldcup26.ir) — best-effort.
   스키마가 확인되면 mapGame()만 조정하면 됩니다. 실패해도 무해.
   ============================================================ */
function teamMatch(name, want){
  if(!name) return false; name=(''+name).toLowerCase();
  const dict={ 'kr':['korea','south korea','korea republic','대한민국','한국'],
    'cz':['czech','czechia','체코'], 'mx':['mexico','멕시코'],
    'za':['south africa','남아공','rsa'] };
  return (dict[want]||[]).some(w=>name.includes(w));
}
function mapGame(g){
  // 다양한 필드명을 방어적으로 수용
  const home = g.home||g.home_team||g.team1||g.teamA||(g.teams&&g.teams.home)||{};
  const away = g.away||g.away_team||g.team2||g.teamB||(g.teams&&g.teams.away)||{};
  const hn = home.name||home.title||g.home_name||g.team1_name||home;
  const an = away.name||away.title||g.away_name||g.team2_name||away;
  const hs = g.home_score??g.score_home??(g.score&&g.score.home)??home.score??g.team1_score;
  const as = g.away_score??g.score_away??(g.score&&g.score.away)??away.score??g.team2_score;
  const st = (''+(g.status||g.state||g.match_status||'')).toLowerCase();
  const final = /(ft|finished|ended|full|final|complete)/.test(st);
  return { hn, an, hs, as, final };
}
async function fetchResults(){
  if(!RESULT_API) return;
  try{
    const res=await fetch(RESULT_API,{cache:'no-store'});
    if(!res.ok) return;
    let data=await res.json();
    const games=Array.isArray(data)?data:(data.games||data.data||data.matches||[]);
    if(!Array.isArray(games)||!games.length) return;
    MATCHES.forEach(m=>{
      const wantH = m.home.kr?'kr':(m.id==='mx-kr'?'mx':m.id==='kr-cz'?(m.home.name==='체코'?'cz':'kr'):'za');
      // 팀 코드 결정
      const codeOf = n => n==='대한민국'?'kr':n==='체코'?'cz':n==='멕시코'?'mx':'za';
      const hc=codeOf(m.home.name), ac=codeOf(m.away.name);
      for(const g of games){
        const mg=mapGame(g);
        const direct = teamMatch(mg.hn,hc)&&teamMatch(mg.an,ac);
        const swap   = teamMatch(mg.hn,ac)&&teamMatch(mg.an,hc);
        if((direct||swap) && mg.hs!=null && mg.as!=null){
          let h=+mg.hs, a=+mg.as; if(swap){ const t=h;h=a;a=t; }
          if(!isNaN(h)&&!isNaN(a)){
            const cur=STATE.results[m.id];
            // 수동 확정값은 건드리지 않음
            if(!(cur && cur.final)) setResult(m.id,h,a,mg.final);
          }
          break;
        }
      }
    });
  }catch(e){ /* CORS/네트워크 실패 → seed·수동 입력으로 동작 */ }
}

/* ============================================================
   init
   ============================================================ */
(function(){
  const nameInput=document.getElementById('meName');
  nameInput.value=myName;
  document.getElementById('meWho').innerHTML = myName? `반가워요, <b>${esc(myName)}</b>` : '';
  nameInput.addEventListener('input', e=>{
    myName=e.target.value; localStorage.setItem(LS.name,myName);
    document.getElementById('meWho').innerHTML = myName? `반가워요, <b>${esc(myName)}</b>` : '';
    renderAll();
  });

  // 첫 미종료 경기를 기본 탭으로
  const firstOpen = MATCHES.findIndex(m=>{ const r=resultOf(m); return !(r&&r.final); });
  active = firstOpen>=0 ? firstOpen : 0;

  initBackend();
  renderAll();
  fetchResults();
  setInterval(fetchResults, 60000); // 1분마다 자동 갱신
  setInterval(renderAll, 60000);    // 잠금/카운트다운 갱신
})();
